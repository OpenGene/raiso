name: riasopy-macos
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.6
  - maturin=1.14.1
  - pkg-config
  - hdf5=1.14.6
  - arpack
  # Use the pthread OpenBLAS variant on both arm64 and x86_64 macOS.
  # The CI workflow explicitly selects this variant after environment creation.
  - libblas=*=*_openblas
  - libcblas=*=*_openblas
  - liblapack=*=*_openblas
  - libopenblas=*=pthreads*
  - fontconfig
  - font-ttf-dejavu
  - delocate>=0.13
