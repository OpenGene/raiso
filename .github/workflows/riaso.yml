name: riaso ci

on:
  push:
    branches: [main]
    paths:
      - "RIASO/riaso/**"
      - ".github/workflows/riaso.yml"
  pull_request:
    branches: [main]
    paths:
      - "RIASO/riaso/**"
      - ".github/workflows/riaso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    name: dist (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: cargo fmt --check
        working-directory: RIASO/riaso
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "RIASO/riaso -> target"

      - name: conda environment (hdf5 1.14.6, arpack, fontconfig, dejavu)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: RIASO/riaso/environment-linux.yml
          activate-environment: riaso
          auto-activate-base: false

      - name: expose conda's HDF5 to pkg-config
        run: |
          set -euo pipefail
          prefix="$(conda info --base)/envs/riaso"
          mkdir -p "$prefix/lib/pkgconfig"
          if [ ! -f "$prefix/lib/pkgconfig/hdf5.pc" ]; then
            printf '%s\n' \
              "prefix=$prefix" \
              'exec_prefix=${prefix}' \
              'libdir=${exec_prefix}/lib' \
              'includedir=${prefix}/include' \
              'Name: hdf5' \
              'Description: HDF5 (without high-level)' \
              'Version: 1.14.6' \
              'Requires:' \
              'Libs: -L${libdir} -lhdf5' \
              'Cflags: -I${includedir}' \
              > "$prefix/lib/pkgconfig/hdf5.pc"
          fi
          {
            echo "HDF5_DIR=$prefix"
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig"
          } >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --exists hdf5 && pkg-config --modversion hdf5

      - name: cargo clippy
        working-directory: RIASO/riaso
        run: |
          cargo clippy --all-targets --locked -- \
            -D warnings \
            -A clippy::type_complexity \
            -A clippy::too_many_arguments \
            -A clippy::derivable_impls

      - name: build the self-contained distribution
        working-directory: RIASO/riaso
        run: bash scripts/build_binary.sh

      - name: show the packaged version
        working-directory: RIASO/riaso
        run: ./dist/riaso -V

      - name: upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: riaso-${{ runner.os }}-${{ runner.arch }}
          path: RIASO/riaso/dist

  build-macos:
    name: dist (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: RIASO/riaso/environment-macos.yml
          activate-environment: riaso-macos
          auto-activate-base: false
      - name: build distribution
        run: bash RIASO/riaso/scripts/build_binary_macos.sh
      - name: test relocation outside the build environment
        env:
          TARGET: ${{ matrix.target }}
        run: |
          relocated=$(mktemp -d)
          cp -R "RIASO/riaso/dist-macos/$TARGET/." "$relocated/"
          env -i HOME="$HOME" "$relocated/riaso" --version
          env -i HOME="$HOME" "$relocated/riaso" --HELP > /dev/null
      - name: archive distribution preserving executable bits
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: tar -czf "riaso-macos-$ARCH.tar.gz" -C "RIASO/riaso/dist-macos/$TARGET" .
      - uses: actions/upload-artifact@v4
        with:
          name: riaso-macos-${{ matrix.arch }}
          path: riaso-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
